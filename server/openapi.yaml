# openapi.yaml
openapi: 3.1.0
info:
  title: webapp-bootstrap API
  version: 1.0.0
  description: |
    OpenAPI 3.1 specification for the webapp-bootstrap backend.

    This file serves two purposes:
    1. Runtime request/response validation via express-openapi-validator
       (install `express-openapi-validator` and mount it in app.ts before your routers)
    2. A language-agnostic contract document — when you swap the Node.js backend
       for Python/Go/Java/etc., this spec is the single source of truth for
       what the API must accept and return.

    Base path for all routes is /api.

servers:
  - url: /api
    description: API server endpoint

paths:
  # --------------------
  # AUTH CONTROLLER
  # --------------------

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate a user and return a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Create a new user account and return a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Invalidate the current session (stateless — client must discard the token).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Logged out

  # --------------------
  # USER CONTROLLER
  # --------------------

  /users/{username}:
    get:
      tags:
        - Users
      summary: Get a user's public profile.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '200':
          description: User profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Users
      summary: Update the authenticated user's profile fields.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileBody'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # --------------------
  # POST CONTROLLER
  # --------------------

  /posts:
    get:
      tags:
        - Posts
      summary: Retrieve a paginated, filtered list of published posts.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: order
          schema:
            $ref: '#/components/schemas/PostOrderType'
          required: false
          description: Sort order. Defaults to newest.
        - in: query
          name: search
          schema:
            type: string
            default: ''
          required: false
          allowEmptyValue: true
          allowReserved: true
          description: Freeform text search across title and content. Prefix a word with # to match a tag.
        - in: query
          name: tag
          schema:
            type: string
          required: false
          description: Exact tag name to filter by.
        - in: query
          name: author
          schema:
            type: string
          required: false
          description: Filter posts by author username.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
      responses:
        '200':
          description: List of populated posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopulatedPost'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags:
        - Posts
      summary: Create a new post.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostBody'
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulatedPost'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /posts/{pid}:
    get:
      tags:
        - Posts
      summary: Retrieve a single post by ID. Increments the view counter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulatedPost'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Posts
      summary: Update a post's title, content, tags, or status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostBody'
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulatedPost'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Posts
      summary: Delete a post permanently.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '204':
          description: Post deleted. No content returned.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /posts/{pid}/like:
    put:
      tags:
        - Posts
      summary: Toggle a like on a post. Liking twice removes the like.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeBody'
      responses:
        '200':
          description: Updated like count and liked state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # --------------------
  # COMMENT CONTROLLER
  # --------------------

  /posts/{pid}/comments:
    get:
      tags:
        - Comments
      summary: Retrieve all comments for a post.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: List of comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopulatedComment'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      tags:
        - Comments
      summary: Add a comment to a post.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentBody'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulatedComment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /health:
    get:
      tags:
        - System
      summary: Liveness check.
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

# ==============================
# COMPONENTS
# ==============================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Include the JWT returned by /auth/login or /auth/register.
        Header format: Authorization: Bearer <token>

  parameters:
    UsernameParam:
      in: path
      name: username
      schema:
        type: string
        minLength: 1
      required: true
      description: The username of the target user.

    PostIdParam:
      in: path
      name: pid
      schema:
        type: string
        format: object-id
        description: MongoDB ObjectId string.
      required: true
      description: The unique ID of the post.

  schemas:

    # --------------------
    # ENUMS
    # --------------------

    PostOrderType:
      type: string
      enum:
        - newest
        - oldest
        - mostLiked
        - trending
      description: |
        newest   — sorted by createdAt descending
        oldest   — sorted by createdAt ascending
        mostLiked — sorted by like count descending
        trending — sorted by view count then recency

    PostStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED

    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
        - MODERATOR

    UserTheme:
      type: string
      enum:
        - LIGHT
        - DARK
        - SYSTEM

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - AWAY
        - HIDDEN

    # --------------------
    # USER SCHEMAS
    # --------------------

    SafeUser:
      type: object
      description: Public user data — password is never included in any API response.
      required:
        - _id
        - username
        - email
        - role
        - status
        - theme
        - bio
        - createdAt
        - lastSeen
      properties:
        _id:
          type: string
          format: object-id
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        theme:
          $ref: '#/components/schemas/UserTheme'
        bio:
          type: string
          default: ''
        avatar:
          type: string
          format: uri
          description: URL to the user's profile picture.
        createdAt:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time

    # --------------------
    # POST SCHEMAS
    # --------------------

    PopulatedPost:
      type: object
      description: Post as returned by API responses — author is a full SafeUser object, not an ID.
      required:
        - _id
        - title
        - content
        - tags
        - status
        - author
        - likes
        - views
        - comments
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          format: object-id
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        author:
          $ref: '#/components/schemas/SafeUser'
        likes:
          type: array
          description: Usernames of users who liked this post.
          items:
            type: string
        views:
          type: integer
          minimum: 0
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PopulatedComment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --------------------
    # COMMENT SCHEMAS
    # --------------------

    PopulatedComment:
      type: object
      required:
        - _id
        - content
        - author
        - createdAt
      properties:
        _id:
          type: string
          format: object-id
        content:
          type: string
          minLength: 1
        author:
          $ref: '#/components/schemas/SafeUser'
        createdAt:
          type: string
          format: date-time

    # --------------------
    # REQUEST BODY SCHEMAS
    # --------------------

    LoginBody:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    RegisterBody:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          description: Alphanumeric and underscores only.
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    UpdateProfileBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bio:
          type: string
          maxLength: 500
        avatar:
          type: string
          format: uri
        theme:
          $ref: '#/components/schemas/UserTheme'
        status:
          $ref: '#/components/schemas/UserStatus'

    CreatePostBody:
      type: object
      additionalProperties: false
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 10
          default: []
        status:
          $ref: '#/components/schemas/PostStatus'
          default: PUBLISHED

    UpdatePostBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        status:
          $ref: '#/components/schemas/PostStatus'

    LikeBody:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1

    CreateCommentBody:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000

    # --------------------
    # RESPONSE BODY SCHEMAS
    # --------------------

    AuthPayload:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Signed JWT. Include as Authorization: Bearer <token> on subsequent requests.
        user:
          $ref: '#/components/schemas/SafeUser'

    LikeResult:
      type: object
      required:
        - likes
        - liked
      properties:
        likes:
          type: integer
          minimum: 0
          description: Total like count after the operation.
        liked:
          type: boolean
          description: Whether the requesting user now likes the post.

    ErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.

  responses:
    ErrorResponse:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

    ValidationError:
      description: Bad request / validation error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              errors:
                type: array
                description: Field-level validation errors (populated by express-openapi-validator).
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    message:
                      type: string

    UnauthorizedError:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

    ForbiddenError:
      description: Authenticated but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

    RateLimited:
      description: Too many requests — apply backoff before retrying.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - retryAfter
            properties:
              error:
                type: string
                example: Too many requests
              retryAfter:
                type: integer
                minimum: 1
                description: Seconds remaining in the rate-limit window.
