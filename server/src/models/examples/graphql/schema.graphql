# Equivalent GraphQL schema.
# Use with: Apollo Server, GraphQL Yoga, Pothos, or any GraphQL library.
# Subscriptions can replace or complement Socket.io for real-time updates.

scalar DateTime

enum UserRole   { USER ADMIN MODERATOR }
enum UserStatus { ACTIVE INACTIVE AWAY HIDDEN }
enum UserTheme  { LIGHT DARK SYSTEM }
enum PostStatus { DRAFT PUBLISHED ARCHIVED }
enum PostOrder  { newest oldest mostLiked trending }

type User {
  id:        ID!
  username:  String!
  email:     String!
  role:      UserRole!
  status:    UserStatus!
  theme:     UserTheme!
  bio:       String!
  avatar:    String
  createdAt: DateTime!
  lastSeen:  DateTime!
  posts:     [Post!]!
}

type Post {
  id:         ID!
  title:      String!
  content:    String!
  tags:       [String!]!
  status:     PostStatus!
  author:     User!
  likes:      [String!]!
  likesCount: Int!
  views:      Int!
  comments:   [Comment!]!
  createdAt:  DateTime!
  updatedAt:  DateTime!
}

type Comment {
  id:        ID!
  content:   String!
  author:    User!
  post:      Post!
  createdAt: DateTime!
}

type AuthPayload {
  token: String!
  user:  User!
}

type LikeResult {
  likes: Int!
  liked: Boolean!
}

# ---- Queries ----
type Query {
  posts(
    order:  PostOrder
    search: String
    tag:    String
    page:   Int
    limit:  Int
  ): [Post!]!
  post(id: ID!): Post
  me: User
}

# ---- Mutations ----
type Mutation {
  login(username: String!, password: String!):                 AuthPayload!
  register(username: String!, email: String!, password: String!): AuthPayload!

  createPost(title: String!, content: String!, tags: [String!]): Post!
  updatePost(id: ID!, title: String, content: String, tags: [String!], status: PostStatus): Post!
  deletePost(id: ID!): Boolean!
  likePost(id: ID!): LikeResult!

  addComment(postId: ID!, content: String!): Comment!
}

# ---- Subscriptions (real-time) ----
type Subscription {
  postCreated:              Post!
  postUpdated:              Post!
  postDeleted:              ID!
  likeUpdated(postId: ID!): LikeResult!
  commentAdded(postId: ID!): Comment!
}
