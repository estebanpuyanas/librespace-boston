version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - '8001:8000'
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/webapp
      PORT: 8000
      JWT_SECRET: change-me-in-production
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - ./shared:/app/shared
    networks:
      - app-network

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_SOCKET_URL: http://localhost:8001
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - ./shared:/app/shared
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
