name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------
  # Type-check and lint every workspace
  # ---------------------------------------------------------------
  typecheck-and-lint:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Type-check client
        run: npm run type-check --workspace=client

      - name: Type-check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Lint
        run: npx eslint . --max-warnings 0
        # Remove --max-warnings 0 if you want lint warnings to not fail CI

  # ---------------------------------------------------------------
  # Backend unit + integration tests
  # ---------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Run backend tests
        working-directory: testing/backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/webapp_test
          JWT_SECRET: ci-test-secret
        run: npm test -- --ci --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: testing/backend/coverage/

  # ---------------------------------------------------------------
  # Build verification (client + server compile without errors)
  # ---------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  # ---------------------------------------------------------------
  # E2E tests (runs only on push to main to avoid slow PR cycles)
  # ---------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Start server
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/webapp_test
          JWT_SECRET: ci-test-secret
          PORT: 8000
          CLIENT_URL: http://localhost:5173
        run: npm run dev &
        # Wait for server to be ready
      - run: npx wait-on http://localhost:8000/health

      - name: Start client
        working-directory: client
        env:
          VITE_API_URL: http://localhost:8000
          VITE_SOCKET_URL: http://localhost:8000
        run: npm run dev &
      - run: npx wait-on http://localhost:5173

      - name: Run Cypress
        working-directory: testing
        run: npm test
