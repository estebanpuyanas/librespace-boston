openapi: 3.1.0
info:
  title: LibreSpace Boston API
  version: 0.1.0
  description: >
    Language-agnostic HTTP contract for the backend. This is the single
    source of truth `shared/` generates a typed client from (see
    shared/orval.config.ts) — never hand-edit shared/generated/.
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Backend is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/ping:
    get:
      operationId: getPing
      summary: Scaffolding smoke test — full openapi -> Kotlin route -> generated client round trip
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Hello, world!
  /api/weather:
    get:
      operationId: getWeather
      summary: Current weather for an already resolved search area
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Current weather conditions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherConditions'
        '502':
          description: Weather provider was unavailable
  /api/location/ip:
    get:
      operationId: getIpLocation
      summary: Coarse, request-only IP location suggestion for the neighborhood picker
      responses:
        '200':
          description: Approximate Boston-area location inferred from the current request IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedLocation'
        '422':
          description: No usable Boston-area IP location was available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationRequiredError'
  /api/favorites:
    get:
      operationId: listFavorites
      summary: List the requesting device's favorite spot IDs
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Favorite spot IDs for this device (empty if none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'
    post:
      operationId: addFavorite
      summary: >
        Favorite a spot for the requesting device. Idempotent — favoriting
        an already-favorited spot is a no-op success, not an error.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '204':
          description: Favorited (or already was)
  /api/favorites/{spot_id}:
    delete:
      operationId: removeFavorite
      summary: >
        Unfavorite a spot for the requesting device. Idempotent — removing a
        favorite that isn't set (or was already removed) is a no-op success.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: spot_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed (or already absent)
  /api/me/friend-code:
    get:
      operationId: getMyFriendCode
      summary: >
        The requesting device's own shareable friend code. Generated and
        persisted on first request if the device doesn't have one yet;
        subsequent calls return the same code.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: This device's friend code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendCodeResponse'
  /api/friends:
    get:
      operationId: listFriends
      summary: List the requesting device's friends
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: This device's friends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsResponse'
    post:
      operationId: addFriend
      summary: >
        Add a friend by their friend code. Creates a mutual friendship
        immediately — no pending request/accept flow. Idempotent — adding
        an existing friend twice is a no-op success.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendRequest'
      responses:
        '204':
          description: Friendship created (or already existed)
        '400':
          description: The friend code belongs to the requesting device itself
        '404':
          description: No device is registered with that friend code
  /api/friends/{friend_device_id}/share:
    post:
      operationId: shareSpot
      summary: >
        Share a spot with a friend. The two devices must already be
        friends — sharing with a non-friend is rejected, not silently
        dropped.
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: friend_device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSpotRequest'
      responses:
        '204':
          description: Share recorded
        '403':
          description: The requesting device and friend_device_id are not friends
  /api/shared-with-me:
    get:
      operationId: getSharedWithMe
      summary: List spots friends have shared with the requesting device
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Spots shared with this device, most useful order left to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedWithMeResponse'
  /api/query:
    post:
      operationId: postQuery
      summary: >
        Fused-dataset spots query (spec.md section 8). Omit `query` for a
        plain nearby-spots lookup with no LLM synthesis (used by the
        homepage bento grid); include `query` to run the full
        natural-language RAG pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Ranked, cited spots matching the request, plus a synthesized answer when `query` was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Neither device coordinates nor a usable IP-based location was available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationRequiredError'
components:
  parameters:
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: >
        Client-generated, persistent per-device identifier (UUID) — the
        product's anonymous identity model, no login/signup/passwords. The
        backend trusts this value as-is (no verification) and auto-registers
        the device on first use. Not a security boundary, an accepted
        tradeoff for a hackathon demo.
      schema:
        type: string
        format: uuid
  schemas:
    AddFavoriteRequest:
      type: object
      required: [spot_id]
      properties:
        spot_id:
          type: string
    FavoritesResponse:
      type: object
      required: [spot_ids]
      properties:
        spot_ids:
          type: array
          items:
            type: string
    FriendCodeResponse:
      type: object
      required: [friend_code]
      properties:
        friend_code:
          type: string
          example: 7KQXPM
    AddFriendRequest:
      type: object
      required: [friend_code]
      properties:
        friend_code:
          type: string
    Friend:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          format: uuid
        friend_code:
          type: string
          nullable: true
          description: Null if that friend hasn't requested their own code yet.
    FriendsResponse:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Friend'
    ShareSpotRequest:
      type: object
      required: [spot_id]
      properties:
        spot_id:
          type: string
    SharedSpot:
      type: object
      required: [spot_id, from_device_id, shared_at]
      properties:
        spot_id:
          type: string
        from_device_id:
          type: string
          format: uuid
        shared_at:
          type: string
          format: date-time
    SharedWithMeResponse:
      type: object
      required: [shared_spots]
      properties:
        shared_spots:
          type: array
          items:
            $ref: '#/components/schemas/SharedSpot'
    QueryRequest:
      type: object
      properties:
        query:
          type: string
          nullable: true
          description: >
            Free-text natural-language question, in any language. Omit this
            field entirely for a structured "what's near me" lookup (no
            LLM call, no synthesized answer) — that's the bento-grid path.
          example: I need a free place near Downtown where I can sit and use Wi-Fi.
        location:
          $ref: '#/components/schemas/Coordinates'
          nullable: true
          description: >
            Precise device or manually selected coordinates. If omitted, the server attempts a
            coarse, request-only IP geolocation lookup and returns 422 when that cannot resolve
            to the Boston area.
        radius_meters:
          type: integer
          default: 800
          description: Search radius around `location`. Ignored if the query text names an explicit neighborhood.
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
          description: >
            Structured amenity filter. Required input when `query` is
            omitted; when `query` is present these are treated as a hint/
            override alongside whatever the LLM extracts from the text.
        language:
          type: string
          nullable: true
          description: BCP-47 hint (e.g. "es", "vi"). Otherwise auto-detected from `query`.
    Coordinates:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        source:
          type: string
          enum: [device, ip, manual]
          description: How these coordinates were obtained — precise device geolocation, coarse IP fallback, or a user-selected neighborhood.
    Amenity:
      type: string
      enum: [wifi, shade, accessible, playground, restroom, free]
    QueryResponse:
      type: object
      required: [spots, disclaimers, resolved_location]
      properties:
        detected_language:
          type: string
          nullable: true
          description: BCP-47 code detected from `query`. Null when `query` was omitted.
        translated_query:
          type: string
          nullable: true
          description: English translation of `query`, for citation/debugging clarity. Null when `query` was omitted or already English.
        answer:
          type: string
          nullable: true
          description: >
            Grounded natural-language answer, in the user's detected
            language, citing which dataset backs each claim. Null when
            `query` was omitted (bento-grid mode returns spots only, no synthesis).
        disclaimers:
          type: array
          items:
            type: string
          description: >
            e.g. "machine-translated — verify details", or a note that a
            requested attribute (like "quiet") has no supporting dataset
            field and was not evaluated.
        spots:
          type: array
          items:
            $ref: '#/components/schemas/Spot'
        highlights:
          $ref: '#/components/schemas/Highlights'
        resolved_location:
          allOf:
            - $ref: '#/components/schemas/ResolvedLocation'
          nullable: true
    ResolvedLocation:
      type: object
      required: [lat, lon, source, label, approximate]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        source:
          type: string
          enum: [device, ip, manual]
        label:
          type: string
        approximate:
          type: boolean
          description: True for an IP-based location, which is only accurate to a broad area.
    LocationRequiredError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: location_required
        message:
          type: string
    WeatherConditions:
      type: object
      required: [temperature_fahrenheit, weather_code]
      properties:
        temperature_fahrenheit:
          type: integer
        weather_code:
          type: integer
    Spot:
      type: object
      required:
        [
          spot_id,
          name,
          lat,
          lon,
          distance_meters,
          has_wifi,
          is_park,
          features,
          accessible,
          tree_density_nearby,
          source_dataset,
        ]
      properties:
        spot_id:
          type: string
        name:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        distance_meters:
          type: number
          format: double
        has_wifi:
          type: boolean
        is_park:
          type: boolean
        features:
          type: array
          items:
            type: string
            enum: [seating, playground, restroom, shade_structure]
        accessible:
          type: object
          required: [value]
          properties:
            value:
              type: boolean
            notes:
              type: string
              nullable: true
        tree_density_nearby:
          type: integer
          description: Approximate shade proxy — tree count within a fixed radius, not verified canopy coverage.
        source_dataset:
          type: object
          additionalProperties:
            type: string
          description: 'Per-field dataset attribution, e.g. {"has_wifi": "Wicked Free Wi-Fi Locations"}.'
    Highlights:
      type: object
      description: Convenience pointers into `spots`, one per bento-grid tile category. Null when no matching spot is in range.
      properties:
        closest_wifi:
          type: string
          nullable: true
        closest_park:
          type: string
          nullable: true
        closest_restroom:
          type: string
          nullable: true
